<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.id != null ? 'Edit Category' : 'New Category'}">Category Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/elea.css}" href="../../static/css/elea.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script th:src="@{/js/app.js}" src="../../static/js/app.js" defer></script>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i data-lucide="package" class="sidebar-brand-icon-svg"></i></div>
            <span class="sidebar-brand-text">eLEA KOREA</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="sidebar-nav-item" data-nav="/">
                <i data-lucide="layout-dashboard" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/orders}" href="/orders" class="sidebar-nav-item" data-nav="/orders">
                <i data-lucide="shopping-bag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Orders</span>
            </a>
            <a th:href="@{/customers}" href="/customers" class="sidebar-nav-item" data-nav="/customers">
                <i data-lucide="users" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Customers</span>
            </a>
            <a th:href="@{/products}" href="/products" class="sidebar-nav-item" data-nav="/products">
                <i data-lucide="package" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Products</span>
            </a>
            <a th:href="@{/categories}" href="/categories" class="sidebar-nav-item" data-nav="/categories">
                <i data-lucide="tag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Categories</span>
            </a>
        </nav>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title" th:text="${pageTitle} ?: 'Category Form'">Category Form</h1>
                <p class="page-subtitle" th:text="${pageSubtitle} ?: 'Order Management System'">Order Management System</p>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button class="btn btn-ghost mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <i data-lucide="menu" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                </button>
            </div>
        </header>

        <section>
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card" style="max-width: 600px;">
                <div class="card-header">
                    <h3 class="card-title" th:text="${category.id != null ? 'Edit Category' : 'New Category'}">Category Form</h3>
                </div>

                <form th:action="@{/categories/save}" method="post" class="card-body">
                    <input type="hidden" name="id" th:value="${category.id}">

                    <div class="form-group">
                        <label class="form-label">Category Name <span class="required">*</span></label>
                        <input type="text" name="name" class="form-input" th:value="${category.name}" placeholder="Enter category name" required>
                    </div>

                    <div class="modal-footer" style="border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
                        <a th:href="@{/categories}" href="/categories" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i data-lucide="save" style="width:16px;height:16px;"></i>
                            <span th:text="${category.id != null ? 'Update' : 'Create'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
