<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id != null ? 'Edit Product' : 'New Product'}">Product Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/elea.css}" href="../../static/css/elea.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script th:src="@{/js/app.js}" src="../../static/js/app.js" defer></script>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i data-lucide="package" class="sidebar-brand-icon-svg"></i></div>
            <span class="sidebar-brand-text">eLEA KOREA</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="sidebar-nav-item" data-nav="/">
                <i data-lucide="layout-dashboard" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/orders}" href="/orders" class="sidebar-nav-item" data-nav="/orders">
                <i data-lucide="shopping-bag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Orders</span>
            </a>
            <a th:href="@{/customers}" href="/customers" class="sidebar-nav-item" data-nav="/customers">
                <i data-lucide="users" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Customers</span>
            </a>
            <a th:href="@{/products}" href="/products" class="sidebar-nav-item" data-nav="/products">
                <i data-lucide="package" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Products</span>
            </a>
            <a th:href="@{/categories}" href="/categories" class="sidebar-nav-item" data-nav="/categories">
                <i data-lucide="tag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Categories</span>
            </a>
        </nav>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title" th:text="${pageTitle} ?: 'Product Form'">Product Form</h1>
                <p class="page-subtitle" th:text="${pageSubtitle} ?: 'Order Management System'">Order Management System</p>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button class="btn btn-ghost mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <i data-lucide="menu" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                </button>
            </div>
        </header>

        <section>
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card" style="max-width: 800px;">
                <div class="card-header">
                    <h3 class="card-title" th:text="${product.id != null ? 'Edit Product' : 'New Product'}">Product Form</h3>
                </div>

                <form th:action="@{/products/save}" method="post" enctype="multipart/form-data" class="card-body">
                    <input type="hidden" name="id" th:value="${product.id}">
                    <input type="hidden" name="productPicture" th:value="${product.productPicture}">

                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label class="form-label">Product Name <span class="required">*</span></label>
                            <input type="text" name="productName" class="form-input" th:value="${product.productName}" placeholder="Product name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Category <span class="required">*</span></label>
                            <select name="categoryId" class="form-select" required>
                                <option value="">Select category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:selected="${product.category != null and product.category.id == cat.id}" th:text="${cat.name}">Category</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Real Price (KRW) <span class="required">*</span></label>
                            <input type="number" step="0.01" name="realPrice" class="form-input" th:value="${product.realPrice}" placeholder="10000" min="0" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Calculated Price</label>
                            <input type="text" id="calculatedPricePreview" class="form-input" th:value="${product.price != null ? #numbers.formatInteger(product.price, 0, 'COMMA') + ' KRW' : 'Auto: realPrice × 1.03 × 1.05'}" readonly style="background: var(--bg-tertiary); color: var(--text-muted);">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Sold Price</label>
                            <input type="text" id="soldPricePreview" class="form-input" th:value="${product.soldPrice != null ? #numbers.formatInteger(product.soldPrice, 0, 'COMMA') + ' KRW' : 'Auto calculated & rounded to 1000'}" readonly style="background: var(--bg-tertiary); color: var(--success); font-weight: 600;">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Product Colors</label>
                            <input type="text" name="productColors" class="form-input" th:value="${product.productColors}" placeholder="Red, Blue, Black (comma separated)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Selling Types</label>
                            <input type="text" name="sellingTypes" class="form-input" th:value="${product.sellingTypes}" placeholder="Retail, Wholesale, etc.">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Product Links</label>
                        <textarea name="productLinks" class="form-textarea" th:text="${product.productLinks}" placeholder="Supplier links, reference URLs (one per line)"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Product Picture</label>
                        <input type="file" name="imageFile" class="form-input" accept="image/*" id="productImageInput">
                        <div class="image-preview" style="margin-top: 0.75rem; max-width: 300px;" id="productImagePreviewBox">
                            <img th:if="${product.productPicture}" th:src="${product.productPicture}" alt="Preview" id="productImagePreview">
                            <div class="image-preview-placeholder" th:unless="${product.productPicture}" id="productImagePlaceholder">
                                No image yet - select a file above
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer" style="border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
                        <a th:href="@{/products}" href="/products" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i data-lucide="save" style="width:16px;height:16px;"></i>
                            <span th:text="${product.id != null ? 'Update' : 'Create'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
