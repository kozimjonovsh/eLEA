<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${order.id != null ? 'Edit Order' : 'New Order'}">Order Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/elea.css}" href="../../static/css/elea.css">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script th:src="@{/js/app.js}" src="../../static/js/app.js" defer></script>
</head>
<body>
<div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-icon"><i data-lucide="package" class="sidebar-brand-icon-svg"></i></div>
            <span class="sidebar-brand-text">eLEA KOREA</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}" href="/" class="sidebar-nav-item" data-nav="/">
                <i data-lucide="layout-dashboard" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/orders}" href="/orders" class="sidebar-nav-item" data-nav="/orders">
                <i data-lucide="shopping-bag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Orders</span>
            </a>
            <a th:href="@{/customers}" href="/customers" class="sidebar-nav-item" data-nav="/customers">
                <i data-lucide="users" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Customers</span>
            </a>
            <a th:href="@{/products}" href="/products" class="sidebar-nav-item" data-nav="/products">
                <i data-lucide="package" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Products</span>
            </a>
            <a th:href="@{/categories}" href="/categories" class="sidebar-nav-item" data-nav="/categories">
                <i data-lucide="tag" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                <span>Categories</span>
            </a>
        </nav>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title" th:text="${pageTitle} ?: 'Order Form'">Order Form</h1>
                <p class="page-subtitle" th:text="${pageSubtitle} ?: 'Order Management System'">Order Management System</p>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button class="btn btn-ghost mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <i data-lucide="menu" class="sidebar-nav-icon sidebar-nav-icon-svg"></i>
                </button>
            </div>
        </header>

        <section>
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card" style="max-width: 700px;">
                <div class="card-header">
                    <h3 class="card-title" th:text="${order.id != null ? 'Edit Order' : 'New Order'}">Order Form</h3>
                </div>

                <form th:action="@{/orders/save}" method="post" class="card-body" id="orderForm">
                    <input type="hidden" name="id" th:value="${order.id}">

                    <div class="form-row">
                        <div class="form-group" style="flex: 1;">
                            <label class="form-label">Customer <span class="required">*</span></label>
                            <select name="customerId" class="form-select" required>
                                <option value="">Select customer</option>
                                <option th:each="c : ${customers}" th:value="${c.id}" th:selected="${order.customer != null and order.customer.id == c.id}" th:text="${c.name}">Customer</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Product <span class="required">*</span></label>
                            <select name="productId" class="form-select" required id="productSelect">
                                <option value="">Select product</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:attr="data-price=${p.price},data-sold-price=${p.soldPrice}"
                                        th:selected="${order.product != null and order.product.id == p.id}"
                                        th:text="${p.productName + ' (' + #numbers.formatInteger(p.soldPrice, 0, 'COMMA') + ' KRW)'}">Product</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Quantity <span class="required">*</span></label>
                            <input type="number" name="quantity" class="form-input" th:value="${order.quantity != null ? order.quantity : 1}" placeholder="1" min="1" required id="quantityInput">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Order Status <span class="required">*</span></label>
                            <select name="status" class="form-select" required>
                                <option th:each="s : ${statuses}" th:value="${s.name()}" th:selected="${order.status != null and order.status.name() == s.name()}" th:text="${s.label}">Packing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Payment Status <span class="required">*</span></label>
                            <select name="paymentStatus" class="form-select" required>
                                <option th:each="s : ${paymentStatuses}" th:value="${s.name()}" th:selected="${order.paymentStatus != null and order.paymentStatus.name() == s.name()}" th:text="${s.label}">Pending</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Order Date</label>
                            <input type="datetime-local" name="orderDate" class="form-input" th:value="${order.orderDate != null ? #temporals.format(order.orderDate, 'yyyy-MM-dd') + 'T' + #temporals.format(order.orderDate, 'HH:mm') : ''}">
                        </div>
                    </div>

                    <div class="card" style="margin-top: 1rem; background: var(--bg-tertiary);">
                        <div class="card-body">
                            <div class="detail-grid">
                                <div class="detail-item">
                                    <div class="detail-label">Unit Price (Sold)</div>
                                    <div class="detail-value mono" id="unitPriceDisplay" th:text="${order.product != null ? #numbers.formatInteger(order.product.soldPrice, 0, 'COMMA') + ' KRW' : 'Select product'}">—</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Unit Cost</div>
                                    <div class="detail-value mono" id="unitCostDisplay" th:text="${order.product != null ? #numbers.formatInteger(order.product.price, 0, 'COMMA') + ' KRW' : 'Select product'}">—</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Revenue</div>
                                    <div class="detail-value mono" style="color: var(--success);" id="revenueDisplay">0 KRW</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Cost</div>
                                    <div class="detail-value mono" id="costDisplay">0 KRW</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">Margin</div>
                                    <div class="detail-value mono" style="color: var(--success);" id="marginDisplay">0 KRW</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer" style="border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
                        <a th:href="@{/orders}" href="/orders" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i data-lucide="save" style="width:16px;height:16px;"></i>
                            <span th:text="${order.id != null ? 'Update' : 'Create'}">Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
